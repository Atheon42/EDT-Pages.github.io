name: Atheon WeChat Reader one-time network probe
on:
  push:
    branches: [test/wechat-reader-network-20261016]
    paths: ['.github/workflows/wechat-reader-network-probe.yml']
permissions:
  contents: read
jobs:
  wechat-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Attempt canonical WeChat article read (no secrets, no publication)
        env:
          ARTICLE_URL: https://mp.weixin.qq.com/s/xj_nxuvM5l05D4uCLpCvRQ
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error, socket, re
          url=os.environ['ARTICLE_URL']
          req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0 Safari/537.36','Accept-Language':'zh-CN,zh;q=0.9'})
          try:
              with urllib.request.urlopen(req,timeout=20) as resp:
                  raw=resp.read(4_000_000)
                  page=raw.decode('utf-8','replace')
                  print('HTTP_STATUS',resp.status)
                  print('BYTES',len(raw))
                  print('ARTICLE_DOM',bool(re.search(r'id=["\\\']js_content["\\\']',page)))
                  print('GALLERY_DOM','swiper_item' in page)
                  print('ARTICLE_TITLE_TAG',bool(re.search('activity-name|og:title',page)))
                  print('IMAGE_CDN_REFS',len(re.findall('mmbiz.qpic.cn',page)))
                  print('CHALLENGE',any(x in page for x in ['请输入验证码','环境异常','访问过于频繁','操作过于频繁']))
          except Exception as exc:
              print('FETCH_ERROR',type(exc).__name__,str(exc)[:250])
              raise SystemExit(1)
          PY